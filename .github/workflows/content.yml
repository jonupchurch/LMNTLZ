name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Will Vercel be able to build this?
  #
  # Added 2026-07-29, after the deployed API turned out to be a feature-005
  # build. Feature 006's routes had never shipped — `/v1/roster` answered 404 in
  # production while passing every test locally — and no deploy since 006 had
  # succeeded. Nothing reported it, because the only endpoint ever checked was
  # `/v1/health`, which exists in every build ever made and so cannot tell one
  # from another.
  #
  # **Vercel compiles the API entrypoint by naming the file**, which makes
  # TypeScript refuse to load tsconfig.json (TS5112) and run with `strict` off.
  # Zod v4's inference collapses to `unknown` without strict. The fix was to stop
  # exporting raw `.ts` from workspace packages, so nothing downstream re-derives
  # our types; this job is what stops that regressing, and it needs no database,
  # so it runs on a fork.
  # ---------------------------------------------------------------------------
  deployability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Declarations must exist before anything can type-check against them.
      - run: pnpm build

      # Two shapes, because they fail differently. The first keeps our config and
      # drops only `strict` — that is the one that produced the five Zod errors.
      # The second is the truer reproduction: name the entrypoint, so no config
      # is read at all and only imports are followed. It is what catches a
      # declaration reachable via `include` and by nothing else.
      - name: Compile the API without strict, keeping the project config
        run: |
          if ! pnpm exec tsc -p apps/api/tsconfig.json --noEmit \
                 --strict false --exactOptionalPropertyTypes false; then
            echo ""
            echo "::error::The API does not compile without 'strict', which is how"
            echo "Vercel compiles it. The deploy will fail and production will keep"
            echo "serving the last build that worked — silently. The usual cause is a"
            echo "workspace package exporting raw .ts instead of built .d.ts; see"
            echo "apps/api/tests/platform/deployability.test.ts."
            exit 1
          fi

      - name: Compile the API by naming the entrypoint, as Vercel does
        run: |
          if ! pnpm exec tsc apps/api/src/index.ts --noEmit --ignoreConfig \
                 --types node --skipLibCheck \
                 --module nodenext --moduleResolution nodenext --target es2022; then
            echo ""
            echo "::error::The API does not compile when the entrypoint is named on"
            echo "the command line, which makes TypeScript ignore tsconfig.json"
            echo "entirely (TS5112) and follow imports alone. Anything reachable only"
            echo "through the config's 'include' is invisible here — an ambient .d.ts"
            echo "needs a /// <reference path> from a file that is actually imported."
            exit 1
          fi

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @lmntlz/content typecheck

      - name: Test
        run: pnpm --filter @lmntlz/content test

      # T041 — the check that makes the build step safe rather than merely
      # convenient. Without it, a hand edit to heroes.generated.ts would survive
      # indefinitely: the emitted roster and the workbook it claims to come from
      # would disagree, and nothing would say so until a designer changed a cell
      # and their edit silently reverted someone else's.
      - name: Regenerate content and fail on any difference
        run: |
          pnpm content:build
          if ! git diff --exit-code --stat; then
            echo ""
            echo "::error::The committed content does not match a fresh build."
            echo "Either heroes.generated.ts / version.generated.ts / MATCHUPS.md"
            echo "were edited by hand, or the workbook changed without running"
            echo "'pnpm content:build'. Run it and commit the result."
            exit 1
          fi

      # Nothing may open the workbook for writing (FR-018). The five scripts that
      # used to were deleted in T008; this is what stops a sixth appearing.
      - name: Assert no tool writes to the workbook
        run: |
          if grep -rn --include=*.py --include=*.ts --include=*.ps1 \
               -e 'wb\.save' -e 'to_excel' -e 'xlsx\.writeFile' -e 'Workbook()' \
               tools/ ; then
            echo "::error::A tool writes to the workbook. The authored source is read-only."
            exit 1
          fi
